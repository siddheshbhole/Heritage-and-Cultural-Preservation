services:
  # ── Backend: FastAPI ─────────────────────────────────────────────────────────
  - type: web
    name: heritage-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ALLOWED_ORIGINS
        # Set this to your frontend static site URL after first deploy
        # e.g. https://heritage-frontend.onrender.com
        sync: false

  # ── Frontend: React + Vite Static Site ──────────────────────────────────────
  - type: web
    name: heritage-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Proxy all /api/* requests to the backend (avoids CORS issues)
      - type: rewrite
        source: /api/*
        destination: https://heritage-and-cultural-preservation.onrender.com/api/*
      # SPA fallback: serve index.html for all unmatched routes
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_ADMIN_EMAIL
        sync: false

databases:
  - name: heritage-db
    databaseName: heritage_culture
    user: heritage_user
    plan: free
