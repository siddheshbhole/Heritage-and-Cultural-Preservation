services:
  db:
    image: postgis/postgis:16-3.4
    container_name: culture-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: culture
      POSTGRES_PASSWORD: culture
      POSTGRES_DB: culture
    ports:
      - "5432:5432"
    volumes:
      - culture_pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U culture -d culture"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  culture_pgdata: